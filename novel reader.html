<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>栞 — 情景リーダー</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;700&family=Shippori+Mincho+B1:wght@400;700;800&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:       #080705;
  --surface:  #110f0c;
  --border:   #2a2520;
  --gold:     #c8a96e;
  --gold2:    #e8c97e;
  --paper:    #f4edd8;
  --ink:      #1c1506;
  --red:      #8b2020;
  --text:     #c9b99a;
  --muted:    #5a5040;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

html, body {
  height: 100%; overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif JP', serif;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════
   SCREENS
═══════════════════════════════ */
.screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: opacity 0.5s, transform 0.5s;
}
.screen.hidden { opacity: 0; pointer-events: none; transform: translateY(12px); }

/* ═══════════════════════════════
   TITLE SCREEN
═══════════════════════════════ */
#screen-title {
  background: radial-gradient(ellipse at 50% 40%, #1a1508 0%, #080705 70%);
  gap: 0;
  padding: 40px 32px;
}

.title-kamon {
  width: 64px; height: 64px;
  margin-bottom: 28px;
  opacity: 0;
  animation: fadeUp 1s 0.3s forwards;
}

.title-kamon svg { width: 100%; height: 100%; }

.app-name {
  font-family: 'Shippori Mincho B1', serif;
  font-size: 42px;
  font-weight: 800;
  color: var(--gold);
  letter-spacing: 0.5em;
  text-indent: 0.5em;
  margin-bottom: 6px;
  opacity: 0;
  animation: fadeUp 1s 0.5s forwards;
}

.app-sub {
  font-size: 11px;
  letter-spacing: 0.35em;
  color: var(--muted);
  margin-bottom: 52px;
  opacity: 0;
  animation: fadeUp 1s 0.7s forwards;
}

.api-setup {
  width: 100%; max-width: 360px;
  opacity: 0;
  animation: fadeUp 1s 0.9s forwards;
}

.api-label {
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--muted);
  margin-bottom: 8px;
  text-align: center;
}

.api-row {
  display: flex; gap: 8px;
}

.api-input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: 'Noto Serif JP', serif;
  font-size: 13px;
  padding: 12px 14px;
  outline: none;
  letter-spacing: 0.05em;
  transition: border-color 0.2s;
}
.api-input:focus { border-color: var(--gold); }
.api-input::placeholder { color: var(--muted); font-size: 11px; }

.btn-start {
  padding: 12px 20px;
  background: linear-gradient(135deg, #5a3010, var(--gold));
  border: none;
  border-radius: 4px;
  color: #fff;
  font-family: 'Shippori Mincho B1', serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.15em;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.2s;
}
.btn-start:hover { opacity: 0.85; }

.title-note {
  margin-top: 20px;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.1em;
  text-align: center;
  line-height: 1.8;
}

/* ═══════════════════════════════
   CAMERA SCREEN
═══════════════════════════════ */
#screen-camera {
  background: #000;
  justify-content: flex-start;
}

#video {
  width: 100%; height: 100%;
  object-fit: cover;
  position: absolute; inset: 0;
}

/* フレームオーバーレイ */
#cam-overlay {
  position: absolute; inset: 0;
  pointer-events: none;
}

/* 上部バー */
.cam-topbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: calc(var(--safe-top) + 16px) 20px 16px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
}

.cam-title {
  font-family: 'Shippori Mincho B1', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.3em;
}

.btn-icon {
  width: 38px; height: 38px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(0,0,0,0.4);
  color: #fff;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(8px);
}

/* スキャン枠 */
.scan-frame {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -52%);
  width: min(85vw, 340px);
  aspect-ratio: 3/4;
}

.scan-frame::before,
.scan-frame::after,
.scan-frame > span::before,
.scan-frame > span::after {
  content: '';
  position: absolute;
  width: 24px; height: 24px;
  border-color: var(--gold);
  border-style: solid;
}
.scan-frame::before  { top: 0;    left: 0;  border-width: 2px 0 0 2px; }
.scan-frame::after   { top: 0;    right: 0; border-width: 2px 2px 0 0; }
.scan-frame > span::before { bottom: 0; left: 0;  border-width: 0 0 2px 2px; }
.scan-frame > span::after  { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

/* スキャンライン */
.scan-line {
  position: absolute;
  left: 4px; right: 4px;
  height: 1px;
  background: linear-gradient(to right, transparent, var(--gold), transparent);
  top: 0;
  animation: scanMove 2.5s ease-in-out infinite;
  opacity: 0.7;
}

@keyframes scanMove {
  0%   { top: 4px;   opacity: 0; }
  10%  { opacity: 0.7; }
  90%  { opacity: 0.7; }
  100% { top: calc(100% - 4px); opacity: 0; }
}

.scan-hint {
  position: absolute;
  bottom: -32px; left: 0; right: 0;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: rgba(255,255,255,0.5);
}

/* シャッターボタン */
.shutter-area {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 24px 0 calc(var(--safe-bot) + 32px);
  background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

#btn-capture {
  width: 76px; height: 76px;
  border-radius: 50%;
  border: 3px solid var(--gold);
  background: rgba(200,169,110,0.15);
  backdrop-filter: blur(8px);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.12s, background 0.12s;
  position: relative;
}

#btn-capture::after {
  content: '';
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--gold);
  opacity: 0.9;
}

#btn-capture:active {
  transform: scale(0.92);
  background: rgba(200,169,110,0.35);
}

#btn-capture.processing::after {
  animation: pulse 0.8s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.9; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.9); }
}

/* canvas（非表示、撮影用） */
#canvas { display: none; }

/* ═══════════════════════════════
   PROCESSING SCREEN
═══════════════════════════════ */
#screen-processing {
  background: var(--bg);
  gap: 28px;
}

.proc-icon {
  width: 60px; height: 60px;
  border: 1px solid var(--gold);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  animation: rotateSlow 3s linear infinite;
}

@keyframes rotateSlow {
  to { transform: rotate(360deg); }
}

.proc-step {
  font-size: 13px;
  letter-spacing: 0.25em;
  color: var(--gold);
  text-align: center;
}

.proc-sub {
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--muted);
  margin-top: 6px;
  text-align: center;
}

/* ═══════════════════════════════
   SCENE SCREEN
═══════════════════════════════ */
#screen-scene {
  background: var(--bg);
  justify-content: flex-start;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

#scene-bg {
  position: fixed; inset: 0;
  background-size: cover;
  background-position: center;
  filter: brightness(0.35) saturate(1.3);
  transform: scale(1.05);
  animation: bgBreath 12s ease-in-out infinite alternate;
  z-index: 0;
}

@keyframes bgBreath {
  from { transform: scale(1.05); }
  to   { transform: scale(1.0); }
}

#scene-bg-gradient {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 50% 0%,   rgba(8,7,5,0.5) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 100%, rgba(8,7,5,0.9) 0%, transparent 70%);
  z-index: 1;
}

.scene-inner {
  position: relative;
  z-index: 2;
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: calc(var(--safe-top) + 16px) 0 calc(var(--safe-bot) + 40px);
}

/* 戻るボタン */
.scene-topbar {
  width: 100%;
  padding: 0 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.btn-back {
  font-size: 11px;
  letter-spacing: 0.2em;
  color: rgba(255,255,255,0.4);
  background: transparent;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 7px 14px;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
}
.btn-back:hover { color: var(--gold); border-color: var(--gold); }

/* 情景カード */
.scene-card {
  width: min(92vw, 460px);
  background: rgba(244,237,216,0.92);
  backdrop-filter: blur(20px) saturate(1.5);
  -webkit-backdrop-filter: blur(20px) saturate(1.5);
  border-radius: 2px;
  border-top: 2px solid var(--gold);
  padding: 36px 28px 32px;
  position: relative;
  opacity: 0;
  transform: translateY(20px);
  animation: cardReveal 0.8s 0.2s ease-out forwards;
}

@keyframes cardReveal {
  to { opacity: 1; transform: translateY(0); }
}

.scene-card::before {
  content: '❧';
  position: absolute;
  top: -15px; left: 50%;
  transform: translateX(-50%);
  background: var(--paper);
  padding: 0 10px;
  color: var(--gold);
  font-size: 18px;
  line-height: 1;
}

/* 原文テキスト（折りたたみ） */
.original-toggle {
  width: min(92vw, 460px);
  margin-top: 16px;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  opacity: 0;
  animation: fadeIn 0.6s 1s forwards;
}

@keyframes fadeIn { to { opacity: 1; } }

.original-header {
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
}

.original-label {
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--muted);
}

.original-arrow {
  font-size: 10px;
  color: var(--muted);
  transition: transform 0.3s;
}
.original-arrow.open { transform: rotate(180deg); }

.original-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
}
.original-body.open { max-height: 400px; }

.original-text {
  padding: 0 16px 16px;
  font-size: 12px;
  line-height: 1.9;
  color: rgba(200,185,160,0.7);
  white-space: pre-wrap;
}

/* カード内テキスト */
#scene-chapter {
  font-size: 10px;
  letter-spacing: 0.4em;
  color: #8b4513;
  text-align: center;
  margin-bottom: 20px;
}

#scene-title {
  font-family: 'Shippori Mincho B1', serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--ink);
  text-align: center;
  letter-spacing: 0.15em;
  margin-bottom: 24px;
  line-height: 1.4;
}

.scene-divider {
  width: 40px;
  height: 1px;
  background: var(--gold);
  margin: 0 auto 24px;
  opacity: 0.5;
}

#scene-text {
  font-family: 'Noto Serif JP', serif;
  font-size: 15px;
  font-weight: 300;
  line-height: 2.15;
  color: var(--ink);
  text-align: justify;
  white-space: pre-line;
}

/* ═══════════════════════════════
   TOAST / ERROR
═══════════════════════════════ */
#toast {
  position: fixed;
  bottom: calc(var(--safe-bot) + 24px);
  left: 50%; transform: translateX(-50%) translateY(80px);
  background: rgba(139,32,32,0.9);
  backdrop-filter: blur(12px);
  color: #fff;
  font-size: 12px;
  letter-spacing: 0.1em;
  padding: 12px 20px;
  border-radius: 24px;
  z-index: 999;
  transition: transform 0.4s;
  white-space: nowrap;
  max-width: 90vw;
  text-align: center;
  white-space: normal;
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* ═══════════════════════════════
   ANIMATIONS
═══════════════════════════════ */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

</style>
</head>
<body>

<!-- ── 画面1：タイトル / API設定 ── -->
<div class="screen" id="screen-title">
  <div class="title-kamon">
    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="30" stroke="#c8a96e" stroke-width="1"/>
      <circle cx="32" cy="32" r="22" stroke="#c8a96e" stroke-width="0.5" stroke-dasharray="2 3"/>
      <path d="M32 8 L32 56 M8 32 L56 32" stroke="#c8a96e" stroke-width="0.5" opacity="0.4"/>
      <path d="M32 14 C38 22, 44 26, 50 32 C44 38, 38 42, 32 50 C26 42, 20 38, 14 32 C20 26, 26 22, 32 14Z"
            stroke="#c8a96e" stroke-width="1" fill="rgba(200,169,110,0.08)"/>
      <circle cx="32" cy="32" r="4" fill="#c8a96e" opacity="0.6"/>
    </svg>
  </div>
  <div class="app-name">栞</div>
  <div class="app-sub">SHIORI — 情景リーダー</div>

  <div class="api-setup">
    <div class="api-label">ANTHROPIC API KEY</div>
    <div class="api-row">
      <input class="api-input" id="api-key-input"
             type="password"
             placeholder="sk-ant-api03-...">
      <button class="btn-start" onclick="startApp()">開く</button>
    </div>
    <div class="title-note">
      APIキーはこの端末のメモリ内にのみ保持されます。<br>
      サーバーへの送信・保存は行いません。
    </div>
  </div>
</div>

<!-- ── 画面2：カメラ ── -->
<div class="screen hidden" id="screen-camera">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="cam-overlay">
    <!-- 上部バー -->
    <div class="cam-topbar">
      <div class="cam-title">栞</div>
      <div class="btn-icon" onclick="goTitle()" title="設定へ戻る">⚙</div>
    </div>

    <!-- スキャン枠 -->
    <div class="scan-frame">
      <span></span>
      <div class="scan-line"></div>
      <div class="scan-hint">本のページをここに合わせる</div>
    </div>

    <!-- シャッター -->
    <div class="shutter-area">
      <div id="btn-capture" onclick="capture()" role="button" aria-label="撮影"></div>
    </div>
  </div>
</div>

<!-- ── 画面3：処理中 ── -->
<div class="screen hidden" id="screen-processing">
  <div class="proc-icon">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <path d="M14 3 C14 3, 20 8, 20 14 C20 20, 14 25, 14 25" stroke="#c8a96e" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M14 3 C14 3, 8 8, 8 14 C8 20, 14 25, 14 25" stroke="#c8a96e" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    </svg>
  </div>
  <div>
    <div class="proc-step" id="proc-step">テキストを認識しています</div>
    <div class="proc-sub" id="proc-sub">しばらくお待ちください</div>
  </div>
</div>

<!-- ── 画面4：情景表示 ── -->
<div class="screen hidden" id="screen-scene">
  <div id="scene-bg"></div>
  <div id="scene-bg-gradient"></div>

  <div class="scene-inner">
    <div class="scene-topbar">
      <button class="btn-back" onclick="goCamera()">← カメラに戻る</button>
      <div style="font-size:10px;letter-spacing:0.2em;color:var(--muted);">情景</div>
    </div>

    <div class="scene-card">
      <div id="scene-chapter">―&ensp;情景描写&ensp;―</div>
      <div id="scene-title">情景タイトル</div>
      <div class="scene-divider"></div>
      <div id="scene-text">ここに情景が表示されます。</div>
    </div>

    <!-- 原文（折りたたみ） -->
    <div class="original-toggle" id="orig-toggle">
      <div class="original-header" onclick="toggleOriginal()">
        <span class="original-label">読み取った原文を見る</span>
        <span class="original-arrow" id="orig-arrow">▼</span>
      </div>
      <div class="original-body" id="orig-body">
        <div class="original-text" id="orig-text"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div id="toast"></div>

<script>
// ══════════════════════════════════════
//  State
// ══════════════════════════════════════
let apiKey = '';
let stream = null;

// ══════════════════════════════════════
//  Screen transitions
// ══════════════════════════════════════
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// ══════════════════════════════════════
//  Title → Camera
// ══════════════════════════════════════
async function startApp() {
  const key = document.getElementById('api-key-input').value.trim();
  if (!key.startsWith('sk-')) {
    toast('APIキーが正しくありません（sk- で始まる必要があります）');
    return;
  }
  apiKey = key;

  // カメラ起動
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width:  { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    document.getElementById('video').srcObject = stream;
    show('screen-camera');
  } catch(e) {
    toast('カメラへのアクセスが拒否されました。ブラウザの設定をご確認ください。');
  }
}

function goTitle() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  show('screen-title');
}

function goCamera() {
  // カメラが止まっていたら再起動
  if (!stream) {
    startApp();
  } else {
    show('screen-camera');
  }
}

// ══════════════════════════════════════
//  Capture → API
// ══════════════════════════════════════
async function capture() {
  const btn = document.getElementById('btn-capture');
  if (btn.classList.contains('processing')) return;
  btn.classList.add('processing');

  // canvas に現フレームを描画
  const video  = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  canvas.width  = video.videoWidth  || 1280;
  canvas.height = video.videoHeight || 720;
  canvas.getContext('2d').drawImage(video, 0, 0);

  // base64化（JPEG 品質0.85）
  const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

  show('screen-processing');
  setStep('テキストを読み取っています…', '縦書き・横書きに対応');

  try {
    const result = await analyzeWithClaude(base64);
    renderScene(result);
  } catch(e) {
    show('screen-camera');
    toast(e.message || 'エラーが発生しました');
  }

  btn.classList.remove('processing');
}

// ══════════════════════════════════════
//  Claude API 呼び出し
// ══════════════════════════════════════
async function analyzeWithClaude(base64) {
  setStep('AIが情景を解析しています…', '文脈・情緒を読み取り中');

  const systemPrompt = `あなたは日本文学の情景描写の専門家です。
ユーザーが小説のページを撮影した画像を送ります。
以下のタスクをこなしてください：

1. 画像からテキストを読み取る（縦書き・横書き対応）
2. 読み取ったテキストの中から「情景描写」部分を特定する
3. その情景を豊かに、詩的に再表現する（200〜300文字程度）
4. 情景にふさわしい短いタイトルをつける（10文字以内）
5. 背景として適した自然・風景のキーワードを英語で1〜3語提案する

必ずJSON形式のみで応答してください。他の文言は一切不要です：
{
  "ocr_text": "読み取った原文テキスト（500文字以内）",
  "scene_title": "情景タイトル",
  "scene_text": "豊かに再表現した情景描写",
  "bg_keyword": "mountain fog / ocean night / forest rain など",
  "chapter_hint": "もし章や場面の情報があれば（なければ空文字）"
}

{
  "error": "エラーの理由を日本語で"
}`;

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: systemPrompt,
      messages: [{
        role: 'user',
        content: [{
          type: 'image',
          source: { type: 'base64', media_type: 'image/jpeg', data: base64 }
        }, {
          type: 'text',
          text: '撮影した小説のページです。情景描写を抽出・再現してください。'
        }]
      }]
    })
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err?.error?.message || `APIエラー (${response.status})`);
  }

  const data = await response.json();
  const raw  = data.content.map(b => b.text || '').join('');

  let parsed;
  try {
    const clean = raw.replace(/```json|```/g, '').trim();
    parsed = JSON.parse(clean);
  } catch {
    throw new Error('AIの応答を解析できませんでした');
  }

  if (parsed.error) throw new Error(parsed.error);
  return parsed;
}

// ══════════════════════════════════════
//  情景表示
// ══════════════════════════════════════
function renderScene(data) {
  setStep('情景を描画しています…', '');

  // テキスト
  document.getElementById('scene-title').textContent = data.scene_title || '情景';
  document.getElementById('scene-text').textContent  = data.scene_text  || '';
  document.getElementById('orig-text').textContent   = data.ocr_text    || '';

  if (data.chapter_hint) {
    document.getElementById('scene-chapter').textContent = `― ${data.chapter_hint} ―`;
  } else {
    document.getElementById('scene-chapter').textContent = '― 情景描写 ―';
  }

  // 背景：Unsplash（キーワードベース）
  const kw  = encodeURIComponent(data.bg_keyword || 'japanese nature landscape');
  const url = `https://source.unsplash.com/1600x900/?${kw}`;
  document.getElementById('scene-bg').style.backgroundImage = `url(${url})`;

  // 原文トグルリセット
  document.getElementById('orig-body').classList.remove('open');
  document.getElementById('orig-arrow').classList.remove('open');

  show('screen-scene');
}

// ══════════════════════════════════════
//  原文トグル
// ══════════════════════════════════════
function toggleOriginal() {
  document.getElementById('orig-body').classList.toggle('open');
  document.getElementById('orig-arrow').classList.toggle('open');
}

// ══════════════════════════════════════
//  Utilities
// ══════════════════════════════════════
function setStep(step, sub) {
  document.getElementById('proc-step').textContent = step;
  document.getElementById('proc-sub').textContent  = sub;
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
}
</script>
