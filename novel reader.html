<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>栞 — 情景リーダー</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;700&family=Shippori+Mincho+B1:wght@400;700;800&display=swap');
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #080705; --surface: #110f0c; --border: #2a2520;
  --gold: #c8a96e; --paper: #f4edd8; --ink: #1c1506;
  --text: #c9b99a; --muted: #5a5040;
}
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Noto Serif JP', serif; }
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s; }
.screen.hidden { opacity: 0; pointer-events: none; }

/* タイトル */
#screen-title { background: radial-gradient(ellipse at 50% 40%, #1a1508 0%, #080705 70%); padding: 40px 32px; gap: 0; }
.title-kamon { width: 64px; height: 64px; margin-bottom: 28px; }
.app-name { font-family: 'Shippori Mincho B1', serif; font-size: 42px; font-weight: 800; color: var(--gold); letter-spacing: 0.5em; text-indent: 0.5em; margin-bottom: 6px; }
.app-sub { font-size: 11px; letter-spacing: 0.35em; color: var(--muted); margin-bottom: 52px; }
.api-setup { width: 100%; max-width: 360px; }
.api-label { font-size: 10px; letter-spacing: 0.3em; color: var(--muted); margin-bottom: 8px; text-align: center; }
.api-row { display: flex; gap: 8px; }
.api-input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 13px; padding: 12px 14px; outline: none; }
.api-input:focus { border-color: var(--gold); }
.api-input::placeholder { color: var(--muted); font-size: 11px; }
.btn-start { padding: 12px 20px; background: linear-gradient(135deg, #5a3010, var(--gold)); border: none; border-radius: 4px; color: #fff; font-size: 14px; font-weight: 700; letter-spacing: 0.15em; cursor: pointer; white-space: nowrap; }
.title-note { margin-top: 16px; font-size: 10px; color: var(--muted); text-align: center; line-height: 1.8; }

/* カメラ */
#screen-camera { background: #000; justify-content: flex-end; }
#video { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
#canvas { display: none; }

/* カメラUI */
.cam-topbar { position: absolute; top: 0; left: 0; right: 0; padding: 52px 20px 16px; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); display: flex; align-items: center; justify-content: space-between; z-index: 10; }
.cam-title { font-family: 'Shippori Mincho B1', serif; font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: 0.3em; }
.btn-icon { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4); color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

.scan-frame { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -52%); width: min(85vw, 340px); aspect-ratio: 3/4; pointer-events: none; }
.scan-frame::before, .scan-frame::after, .scan-frame > span::before, .scan-frame > span::after { content: ''; position: absolute; width: 24px; height: 24px; border-color: var(--gold); border-style: solid; }
.scan-frame::before  { top: 0;    left: 0;  border-width: 2px 0 0 2px; }
.scan-frame::after   { top: 0;    right: 0; border-width: 2px 2px 0 0; }
.scan-frame > span::before { bottom: 0; left: 0;  border-width: 0 0 2px 2px; }
.scan-frame > span::after  { bottom: 0; right: 0; border-width: 0 2px 2px 0; }
.scan-line { position: absolute; left: 4px; right: 4px; height: 1px; background: linear-gradient(to right, transparent, var(--gold), transparent); animation: scanMove 2.5s ease-in-out infinite; opacity: 0.7; }
@keyframes scanMove { 0% { top: 4px; opacity: 0; } 10% { opacity: 0.7; } 90% { opacity: 0.7; } 100% { top: calc(100% - 4px); opacity: 0; } }

/* シャッターエリア */
.shutter-area { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px 0 50px; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); display: flex; flex-direction: column; align-items: center; gap: 16px; z-index: 20; }

/* メインシャッターボタン */
#btn-capture {
  width: 80px; height: 80px; border-radius: 50%;
  border: 4px solid var(--gold);
  background: rgba(200,169,110,0.3);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: rgba(200,169,110,0.5);
  touch-action: manipulation;
  position: relative;
  z-index: 30;
}
#btn-capture-inner {
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--gold);
  pointer-events: none;
}

/* テキストボタン（フォールバック）*/
#btn-capture-text {
  padding: 14px 36px;
  background: var(--gold);
  border: none; border-radius: 4px;
  color: var(--ink);
  font-family: 'Shippori Mincho B1', serif;
  font-size: 16px; font-weight: 700; letter-spacing: 0.2em;
  cursor: pointer;
  -webkit-tap-highlight-color: rgba(200,169,110,0.5);
  touch-action: manipulation;
  z-index: 30;
}

/* 処理中 */
#screen-processing { background: var(--bg); gap: 28px; }
.proc-icon { width: 60px; height: 60px; border: 1px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: rotateSlow 3s linear infinite; }
@keyframes rotateSlow { to { transform: rotate(360deg); } }
.proc-step { font-size: 13px; letter-spacing: 0.25em; color: var(--gold); text-align: center; }
.proc-sub  { font-size: 11px; letter-spacing: 0.15em; color: var(--muted); margin-top: 6px; text-align: center; }

/* 情景 */
#screen-scene { background: var(--bg); justify-content: flex-start; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#scene-bg { position: fixed; inset: 0; background-size: cover; background-position: center; filter: brightness(0.35) saturate(1.3); z-index: 0; }
#scene-bg-gradient { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 100%, rgba(8,7,5,0.9) 0%, transparent 70%); z-index: 1; }
.scene-inner { position: relative; z-index: 2; width: 100%; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 60px 0 60px; }
.scene-topbar { width: 100%; padding: 0 20px 24px; display: flex; align-items: center; justify-content: space-between; }
.btn-back { font-size: 11px; letter-spacing: 0.2em; color: rgba(255,255,255,0.4); background: transparent; border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; padding: 7px 14px; cursor: pointer; }
.scene-card { width: min(92vw, 460px); background: rgba(244,237,216,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 2px; border-top: 2px solid var(--gold); padding: 36px 28px 32px; position: relative; animation: cardReveal 0.8s ease-out both; }
@keyframes cardReveal { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
.scene-card::before { content: '❧'; position: absolute; top: -15px; left: 50%; transform: translateX(-50%); background: var(--paper); padding: 0 10px; color: var(--gold); font-size: 18px; line-height: 1; }
#scene-chapter { font-size: 10px; letter-spacing: 0.4em; color: #8b4513; text-align: center; margin-bottom: 20px; }
#scene-title { font-family: 'Shippori Mincho B1', serif; font-size: 22px; font-weight: 800; color: var(--ink); text-align: center; letter-spacing: 0.15em; margin-bottom: 24px; line-height: 1.4; }
.scene-divider { width: 40px; height: 1px; background: var(--gold); margin: 0 auto 24px; opacity: 0.5; }
#scene-text { font-size: 15px; font-weight: 300; line-height: 2.15; color: var(--ink); text-align: justify; white-space: pre-line; }
.original-toggle { width: min(92vw, 460px); margin-top: 16px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.original-header { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.original-label { font-size: 10px; letter-spacing: 0.3em; color: var(--muted); }
.original-arrow { font-size: 10px; color: var(--muted); transition: transform 0.3s; }
.original-arrow.open { transform: rotate(180deg); }
.original-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; }
.original-body.open { max-height: 400px; }
.original-text { padding: 0 16px 16px; font-size: 12px; line-height: 1.9; color: rgba(200,185,160,0.7); white-space: pre-wrap; }

/* Toast */
#toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(80px); background: rgba(139,32,32,0.95); color: #fff; font-size: 13px; padding: 14px 22px; border-radius: 24px; z-index: 999; transition: transform 0.4s; max-width: 85vw; text-align: center; }
#toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- タイトル -->
<div class="screen" id="screen-title">
  <div class="title-kamon">
    <svg viewBox="0 0 64 64" fill="none">
      <circle cx="32" cy="32" r="30" stroke="#c8a96e" stroke-width="1"/>
      <circle cx="32" cy="32" r="22" stroke="#c8a96e" stroke-width="0.5" stroke-dasharray="2 3"/>
      <path d="M32 14 C38 22,44 26,50 32 C44 38,38 42,32 50 C26 42,20 38,14 32 C20 26,26 22,32 14Z" stroke="#c8a96e" stroke-width="1" fill="rgba(200,169,110,0.08)"/>
      <circle cx="32" cy="32" r="4" fill="#c8a96e" opacity="0.6"/>
    </svg>
  </div>
  <div class="app-name">栞</div>
  <div class="app-sub">SHIORI — 情景リーダー</div>
  <div class="api-setup">
    <div class="api-label">ANTHROPIC API KEY</div>
    <div class="api-row">
      <input class="api-input" id="api-key-input" type="password" placeholder="sk-ant-api03-...">
      <button class="btn-start" id="btn-start">開く</button>
    </div>
    <div class="title-note">APIキーはこの端末のメモリ内にのみ保持されます。</div>
  </div>
</div>

<!-- カメラ -->
<div class="screen hidden" id="screen-camera">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="cam-topbar">
    <div class="cam-title">栞</div>
    <div class="btn-icon" id="btn-settings">⚙</div>
  </div>

  <div class="scan-frame"><span></span><div class="scan-line"></div></div>

  <div class="shutter-area">
    <!-- 丸ボタン -->
    <div id="btn-capture"><div id="btn-capture-inner"></div></div>
    <!-- テキストボタン（確実に動く） -->
    <button id="btn-capture-text">撮　影</button>
  </div>
</div>

<!-- 処理中 -->
<div class="screen hidden" id="screen-processing">
  <div class="proc-icon">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <path d="M14 3 C14 3,20 8,20 14 C20 20,14 25,14 25" stroke="#c8a96e" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M14 3 C14 3,8 8,8 14 C8 20,14 25,14 25" stroke="#c8a96e" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    </svg>
  </div>
  <div>
    <div class="proc-step" id="proc-step">テキストを読み取っています…</div>
    <div class="proc-sub"  id="proc-sub">しばらくお待ちください</div>
  </div>
</div>

<!-- 情景 -->
<div class="screen hidden" id="screen-scene">
  <div id="scene-bg"></div>
  <div id="scene-bg-gradient"></div>
  <div class="scene-inner">
    <div class="scene-topbar">
      <button class="btn-back" id="btn-back">← カメラに戻る</button>
      <div style="font-size:10px;letter-spacing:0.2em;color:var(--muted);">情景</div>
    </div>
    <div class="scene-card">
      <div id="scene-chapter">― 情景描写 ―</div>
      <div id="scene-title">情景タイトル</div>
      <div class="scene-divider"></div>
      <div id="scene-text"></div>
    </div>
    <div class="original-toggle">
      <div class="original-header" id="orig-header">
        <span class="original-label">読み取った原文を見る</span>
        <span class="original-arrow" id="orig-arrow">▼</span>
      </div>
      <div class="original-body" id="orig-body">
        <div class="original-text" id="orig-text"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
var apiKey = '';
var stream = null;
var busy   = false;

function show(id) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.add('hidden'); });
  document.getElementById(id).classList.remove('hidden');
}

window.addEventListener('load', function() {
  document.getElementById('btn-start').addEventListener('click', startApp);
  document.getElementById('btn-settings').addEventListener('click', goTitle);
  document.getElementById('btn-back').addEventListener('click', goCamera);
  document.getElementById('orig-header').addEventListener('click', toggleOriginal);

  // 丸ボタン
  var circle = document.getElementById('btn-capture');
  circle.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});
  circle.addEventListener('touchend',   function(e){ e.preventDefault(); doCapture(); });
  circle.addEventListener('click', doCapture);

  // テキストボタン
  var textBtn = document.getElementById('btn-capture-text');
  textBtn.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});
  textBtn.addEventListener('touchend',   function(e){ e.preventDefault(); doCapture(); });
  textBtn.addEventListener('click', doCapture);
});

function startApp() {
  var key = document.getElementById('api-key-input').value.trim();
  if (!key.startsWith('sk-')) { showToast('APIキーが正しくありません'); return; }
  apiKey = key;
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: {ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} },
    audio: false
  }).then(function(s) {
    stream = s;
    document.getElementById('video').srcObject = s;
    show('screen-camera');
  }).catch(function() {
    showToast('カメラへのアクセスが拒否されました');
  });
}

function goTitle() {
  if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  show('screen-title');
}

function goCamera() {
  if (!stream) { startApp(); return; }
  show('screen-camera');
}

function doCapture() {
  if (busy) return;
  busy = true;

  var video  = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  canvas.width  = video.videoWidth  || 1280;
  canvas.height = video.videoHeight || 720;
  canvas.getContext('2d').drawImage(video, 0, 0);
  var base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

  show('screen-processing');
  setStep('テキストを読み取っています…', '縦書き・横書きに対応');

  callClaude(base64).then(function(result) {
    renderScene(result);
  }).catch(function(e) {
    show('screen-camera');
    showToast(e.message || 'エラーが発生しました');
  }).finally(function() {
    busy = false;
  });
}

function callClaude(base64) {
  setStep('AIが情景を解析しています…', '文脈・情緒を読み取り中');
  var sys = 'あなたは日本文学の情景描写の専門家です。小説ページの画像からテキストを読み取り、情景描写を抽出・再表現してください。必ずJSONのみで応答：{"ocr_text":"原文","scene_title":"タイトル10文字以内","scene_text":"詩的な情景200-300文字","bg_keyword":"英語キーワード","chapter_hint":"章情報か空文字"}。読めない場合：{"error":"理由"}';

  return fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5',
      max_tokens: 1000,
      system: sys,
      messages: [{
        role: 'user',
        content: [
          {type:'image', source:{type:'base64', media_type:'image/jpeg', data:base64}},
          {type:'text',  text:'このページの情景描写を抽出・再現してください。'}
        ]
      }]
    })
  }).then(function(res) {
    if (!res.ok) return res.json().then(function(e){ throw new Error((e.error&&e.error.message)||'APIエラー '+res.status); });
    return res.json();
  }).then(function(data) {
    var raw = data.content.map(function(b){return b.text||'';}).join('');
    var clean = raw.replace(/```json|```/g,'').trim();
    var parsed;
    try { parsed = JSON.parse(clean); } catch(e) { throw new Error('応答の解析に失敗しました'); }
    if (parsed.error) throw new Error(parsed.error);
    return parsed;
  });
}

function renderScene(data) {
  document.getElementById('scene-title').textContent   = data.scene_title || '情景';
  document.getElementById('scene-text').textContent    = data.scene_text  || '';
  document.getElementById('orig-text').textContent     = data.ocr_text    || '';
  document.getElementById('scene-chapter').textContent = data.chapter_hint ? '― '+data.chapter_hint+' ―' : '― 情景描写 ―';
  var kw = encodeURIComponent(data.bg_keyword || 'japanese nature');
  document.getElementById('scene-bg').style.backgroundImage = 'url(https://source.unsplash.com/1600x900/?'+kw+')';
  document.getElementById('orig-body').classList.remove('open');
  document.getElementById('orig-arrow').classList.remove('open');
  show('screen-scene');
}

function toggleOriginal() {
  document.getElementById('orig-body').classList.toggle('open');
  document.getElementById('orig-arrow').classList.toggle('open');
}

function setStep(s, sub) {
  document.getElementById('proc-step').textContent = s;
  document.getElementById('proc-sub').textContent  = sub;
}

var toastTimer;
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 5000);
}
</script>
</body>
</html>
